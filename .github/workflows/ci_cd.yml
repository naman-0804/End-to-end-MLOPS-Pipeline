name: Titanic MLOps Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  mlops_pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Python runtime
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    # 3. Install dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Step: Data Validation
    - name: Run Data Validation
      run: |
        python src/data_validation.py

    # 5. Step: Model Training & Experiment Logging
    - name: Train Model
      run: |
        python src/train.py

    # 6. Step: Run Automated Pytest Suite
    - name: Run Pytest Suite
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ -v

    # 7. Step: Build Docker Container
    - name: Build Docker Image
      run: |
        docker build -t titanic-mlops-api:latest .
